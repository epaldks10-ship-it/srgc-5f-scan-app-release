<title>새로고침 적재</title>
<!--
  "새로고침 적재" 앱 스캔 탭의 웹판 (아이폰용, 안드로이드에서도 동작)
  · 상품 DB 를 비춰 둔 구글 시트(SheetScanSource.kt 와 같은 시트)만 읽는다. 로그인·Supabase 없음.
  · 카메라가 계속 켜져 있고, 찍히면 상품명·옵션·로케이션을 크게 보여 준다.
  · 인식: 안드로이드 크롬은 BarcodeDetector, 아이폰 사파리는 ZXing(같은 폴더 zxing-library-0.21.3.min.js).
    ZXing 의 decodeFromVideoElement 계열은 이미 재생 중인 video 에서 'playing' 을 기다리다 멈출 수 있어서
    쓰지 않는다. 화면 가운데 띠만 캔버스로 잘라 직접 디코드한다.
-->
<style>
  :root{
    --green:#137A65; --green-soft:#E0F2EC; --orange:#D65B3F; --orange-soft:#FBE9E4;
    --canvas:#F3F6F4; --ink:#1A1C1B; --sub:#6F7975; --line:#D9DEDB; --red:#B42318; --white:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input{font-family:inherit}
  html,body{margin:0;background:var(--canvas);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:5;background:var(--white);box-shadow:0 1px 0 var(--line);
    padding:env(safe-area-inset-top) 20px 0;}
  header .bar{height:58px;display:flex;align-items:center;gap:9px;font-size:21px;font-weight:700}
  header svg{flex:none}
  main{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}

  .cam{position:relative;height:250px;border-radius:14px;overflow:hidden;background:#000}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .scanline{position:absolute;left:9%;right:9%;top:50%;height:2px;margin-top:-1px;background:#E24B4A;
    box-shadow:0 0 6px rgba(226,75,74,.8)}
  .cam .torch{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.35);color:#fff;border:0;
    border-radius:8px;padding:8px 12px;font-size:15px}
  .cam .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:20px;text-align:center;color:#fff;background:rgba(0,0,0,.72);font-size:15px;line-height:1.45}
  .cam .overlay #camMsg{white-space:pre-line}
  .cam .overlay button{background:var(--green);color:#fff;border:0;border-radius:12px;padding:13px 22px;
    font-size:17px;font-weight:700}
  [hidden]{display:none!important}

  .result{background:var(--white);border:1px solid var(--line);border-radius:14px;min-height:210px;
    padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .result .idle{color:var(--sub);font-size:17px}
  .result .name{font-size:24px;line-height:30px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
  .result .option{margin-top:4px;font-size:20px;line-height:26px;font-weight:500;color:var(--sub);overflow-wrap:anywhere}
  .result .loc{margin-top:16px;width:100%;border-radius:12px;padding:12px 10px;background:var(--green-soft);color:var(--green)}
  .result .loc .lbl{font-size:13px;font-weight:600}
  .result .loc .val{font-size:46px;line-height:52px;font-weight:800;overflow-wrap:anywhere}
  .result .loc.none{background:var(--orange-soft);color:var(--orange)}
  .result .loc.none .val{font-size:26px;line-height:34px;font-weight:700}
  .result .code{margin-top:10px;font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
  .result .bad{font-size:22px;font-weight:700;color:var(--red)}
  .result .err{font-size:17px;font-weight:600;color:var(--red)}
  .spinner{width:30px;height:30px;border:3px solid var(--green-soft);border-top-color:var(--green);border-radius:50%;
    animation:spin .8s linear infinite}
  .spinner.small{width:15px;height:15px;border-width:2px}
  @keyframes spin{to{transform:rotate(360deg)}}

  form.manual{display:flex;align-items:center;border:1px solid #8a948f;border-radius:6px;background:var(--canvas);padding:0 4px 0 14px}
  form.manual input{flex:1;min-width:0;height:56px;border:0;background:transparent;font-size:16px;color:var(--ink);outline:none}
  form.manual button{background:none;border:0;color:var(--green);font-size:16px;font-weight:600;padding:12px}

  .dbinfo{border:0;background:none;width:100%;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub)}
  .dbinfo .row{display:flex;align-items:center;gap:7px;font-size:13px}
  .dbinfo .when{font-size:14px;font-weight:700;color:var(--ink)}
  .dbinfo .when.unknown{color:var(--orange)}
  .dbinfo .synced{font-size:11px}
  .foot{text-align:center;font-size:11px;color:var(--sub);padding-bottom:12px}
</style>
</head>
<body>
<header><div class="bar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#137A65" stroke-width="2" aria-hidden="true">
    <rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M10 13h4"/>
  </svg>
  새로고침 적재
</div></header>

<main>
  <section class="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="scanline"></div>
    <button class="torch" id="torch" type="button" hidden>플래시 켜기</button>
    <div class="overlay" id="camOverlay">
      <div id="camMsg">카메라를 켜는 중…</div>
      <button id="camStart" type="button" hidden>카메라 켜기</button>
    </div>
  </section>

  <section class="result" id="result" aria-live="polite">
    <div class="idle">상품 바코드를 카메라에 비춰 주세요.</div>
  </section>

  <form class="manual" id="manual" autocomplete="off">
    <input id="manualInput" type="text" inputmode="text" enterkeyhint="search" autocapitalize="characters"
           spellcheck="false" placeholder="바코드 직접 입력 / 외장 스캐너">
    <button type="submit">조회</button>
  </form>

  <button class="dbinfo" id="dbinfo" type="button" aria-label="DB 최신화 시각 다시 확인">
    <span class="row"><span id="dbIcon">↻</span><span>DB 최신화</span><span class="when unknown" id="dbWhen">확인되지 않음</span></span>
    <span class="synced" id="dbSynced" hidden></span>
  </button>

  <div class="foot">웹 버전 · 사파리 공유 버튼 → "홈 화면에 추가"를 하면 앱처럼 열립니다</div>
</main>

<script src="zxing-library-0.21.3.min.js" defer></script>
<script>
'use strict';
// ── 설정 (앱 SheetScanSource.kt · MainViewModel.kt 와 같은 값) ──
const SHEET_ID = '1UsKJ8SALhyJkHBLBDY6B2ZvADWaKnkvYqGH1VG24Lz4';
const SAME_CODE_GAP_MS = 3000;   // 같은 바코드를 계속 비추고 있을 때 다시 읽는 간격
const OTHER_CODE_GAP_MS = 800;   // 다른 바코드로 바꿨을 때
const SCAN_INTERVAL_MS = 150;
const CACHE_MS = 10 * 60 * 1000, CACHE_MAX = 300;
const TIMEOUT_MS = 8000;

const $ = id => document.getElementById(id);
const video = $('video'), resultEl = $('result');

// ── 시트 조회 ──
function parseCsv(text){
  const rows=[]; let row=[], cell='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){
      if(c!=='"') cell+=c;
      else if(text[i+1]==='"'){ cell+='"'; i++; }
      else quoted=false;
    } else if(c==='"') quoted=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); cell=''; rows.push(row); row=[]; }
    else if(c!=='\r') cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

async function query(sheet, tq, headers){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&headers=${headers}&tq=${encodeURIComponent(tq)}`;
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),TIMEOUT_MS);
  let text;
  try{
    const res=await fetch(url,{signal:ctrl.signal,cache:'no-store'});
    if(!res.ok) throw new Error(`시트를 읽지 못했습니다 (${res.status})`);
    text=await res.text();
  }catch(e){
    if(e.message&&e.message.startsWith('시트를')) throw e;
    throw new Error('시트에 연결하지 못했습니다. 네트워크를 확인해 주세요.');
  }finally{ clearTimeout(timer); }
  const head=text.trimStart();
  if(head.startsWith('<')||head.startsWith('{')) throw new Error('스캔용 시트를 읽을 수 없습니다. 공유 설정과 탭 이름을 확인해 주세요.');
  const rows=parseCsv(text);
  return headers>0 ? rows.slice(headers) : rows;
}
const cell=(r,i)=>((r&&r[i])||'').trim();

async function lookup(barcode){
  const code=barcode.replace(/'/g,'').replace(/\\/g,'');
  // 상품코드로도 본다 — 바코드를 재등록한 상품은 박스에 찍힌 값이 상품코드일 수 있다
  const rows=await query('DB',`select A,B,C,D,E where A = '${code}' or B = '${code}' limit 5`,1);
  const hit=rows.find(r=>cell(r,0)===code)||rows.find(r=>cell(r,1)===code);
  if(!hit) return null;
  return {barcode:cell(hit,0)||code, name:cell(hit,2), option:cell(hit,3), location:cell(hit,4)};
}

// 통합바코드(박스코드+바코드+수량)를 찍어도 가운데 바코드만 쓴다
function parseScan(raw){
  const cleaned=raw.trim();
  const parts=cleaned.split(/\s*[+|,;\t]\s*/).filter(Boolean);
  const qty=parseInt(parts[2],10);
  if(parts.length===3&&parts[0]&&parts[1]&&qty>0&&String(qty)===parts[2]) return parts[1].toUpperCase();
  return cleaned.toUpperCase();
}

// ── 결과 화면 ──
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(state){
  let h='';
  switch(state.kind){
    case 'idle': h='<div class="idle">상품 바코드를 카메라에 비춰 주세요.</div>'; break;
    case 'loading': h=`<div class="spinner"></div><div class="code" style="margin-top:12px">${esc(state.code)}</div>`; break;
    case 'found': {
      const p=state.product, none=!p.location;
      h=`<div class="name">${esc(p.name||'상품명 없음')}</div>`+
        (p.option?`<div class="option">${esc(p.option)}</div>`:'')+
        `<div class="loc${none?' none':''}"><div class="lbl">로케이션</div><div class="val">${none?'지정되지 않음':esc(p.location)}</div></div>`+
        `<div class="code">${esc(p.barcode)}</div>`;
      break;
    }
    case 'notfound': h=`<div class="bad">일치하는 바코드가 없습니다.</div><div class="code">${esc(state.code)}</div>`; break;
    case 'error': h=`<div class="err">${esc(state.message)}</div><div class="code">${esc(state.code)}</div>`; break;
  }
  resultEl.innerHTML=h;
}

// 같은 상품을 다시 찍으면 시트에 묻지 않는다. null(없는 바코드)도 기억한다
const cache=new Map();
let lookupSeq=0;
async function scanLookup(raw){
  const code=parseScan(raw||'');
  if(!code) return;
  const hit=cache.get(code);
  if(hit&&Date.now()-hit.at<CACHE_MS){
    render(hit.product?{kind:'found',product:hit.product}:{kind:'notfound',code});
    return;
  }
  const seq=++lookupSeq;
  render({kind:'loading',code});
  try{
    const product=await lookup(code);
    cache.delete(code); cache.set(code,{product,at:Date.now()});
    if(cache.size>CACHE_MAX) cache.delete(cache.keys().next().value);
    if(seq===lookupSeq) render(product?{kind:'found',product}:{kind:'notfound',code});
  }catch(e){
    if(seq===lookupSeq) render({kind:'error',code,message:e.message||'조회에 실패했습니다.'});
  }
}

// ── DB 최신화 시각 (INFO 탭: B1 DB 최신화, B2 시트 반영) ──
let checkingDb=false;
function showDbInfo(dbAt,syncedAt){
  const w=$('dbWhen');
  w.textContent=dbAt||'확인되지 않음'; w.classList.toggle('unknown',!dbAt);
  $('dbSynced').hidden=!syncedAt; $('dbSynced').textContent=syncedAt?`시트 반영 ${syncedAt}`:'';
}
async function refreshDbInfo(){
  if(checkingDb) return;
  checkingDb=true; $('dbIcon').outerHTML='<span id="dbIcon" class="spinner small"></span>';
  try{
    const rows=await query('INFO','select A,B limit 2',0);
    const dbAt=cell(rows[0],1), syncedAt=cell(rows[1],1);
    let prevSync=''; try{ prevSync=localStorage.getItem('sheet_synced_at')||''; }catch(e){}
    if(syncedAt!==prevSync) cache.clear();   // 시트가 새로 반영됐으면 기억해 둔 로케이션은 옛날 값일 수 있다
    try{ localStorage.setItem('db_updated_at',dbAt); localStorage.setItem('sheet_synced_at',syncedAt); }catch(e){}
    showDbInfo(dbAt,syncedAt);
  }catch(e){ /* 표시는 이전 값을 그대로 둔다 */ }
  finally{ checkingDb=false; $('dbIcon').outerHTML='<span id="dbIcon">↻</span>'; }
}

// ── 확인음 ── 아이폰은 사용자가 한 번 화면을 눌러야 소리가 난다(그 전에는 진동·소리 없이 결과만)
let audioCtx=null, beepBuf=null;
function unlockAudio(){
  try{
    if(navigator.audioSession) navigator.audioSession.type='transient';   // 무음 스위치 상태에서도 짧게 울리도록 (지원 기기만)
  }catch(e){}
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      audioCtx=new AC();
      fetch('beep.mp3').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>audioCtx.decodeAudioData(b,ok,no))).then(buf=>{beepBuf=buf;}).catch(()=>{});
    }
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function beep(){
  if(navigator.vibrate) try{ navigator.vibrate(40); }catch(e){}
  if(!audioCtx||audioCtx.state!=='running') return;
  try{
    if(beepBuf){ const s=audioCtx.createBufferSource(); s.buffer=beepBuf; s.connect(audioCtx.destination); s.start(); return; }
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=2200; g.gain.value=0.25; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.15);
  }catch(e){}
}

// ── 카메라 · 인식 ──
let stream=null, running=false, wanted=true, loopTimer=null, detector=null, zx=null, torchOn=false;
let lastCode='', lastAt=0;
const grab=document.createElement('canvas');
const grabCtx=grab.getContext('2d',{willReadFrequently:true});

function overlay(msg,showButton){
  $('camOverlay').hidden=!msg; $('camMsg').textContent=msg||''; $('camStart').hidden=!showButton;
}

function onDecoded(raw){
  const code=(raw||'').trim(); if(!code) return;
  const now=Date.now();
  if(now-lastAt < (code===lastCode?SAME_CODE_GAP_MS:OTHER_CODE_GAP_MS)) return;
  lastCode=code; lastAt=now;
  beep(); scanLookup(code);
}

async function makeDetector(){
  if(!('BarcodeDetector' in window)) return null;
  try{
    const want=['code_128','code_39','code_93','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code','data_matrix'];
    const ok=await window.BarcodeDetector.getSupportedFormats();
    const formats=want.filter(f=>ok.includes(f));
    return formats.length?new window.BarcodeDetector({formats}):null;
  }catch(e){ return null; }
}

function makeZx(){
  const Z=window.ZXing; if(!Z) return null;
  const hints=new Map();
  const F=Z.BarcodeFormat;
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.CODE_128,F.CODE_39,F.CODE_93,F.CODABAR,F.EAN_13,F.EAN_8,F.ITF,F.UPC_A,F.UPC_E,F.QR_CODE,F.DATA_MATRIX]);
  const reader=new Z.MultiFormatReader(); reader.setHints(hints);
  return reader;
}

// 화면 가운데 띠(빨간 선 둘레)만 잘라 ZXing 에 넘긴다. 전체 프레임보다 훨씬 빠르다
function decodeZx(){
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh) return null;
  const bandH=Math.min(vh,Math.round(vw*0.5));
  const sy=Math.round((vh-bandH)/2);
  const scale=Math.min(1,960/vw);
  const w=Math.round(vw*scale), h=Math.round(bandH*scale);
  if(grab.width!==w||grab.height!==h){ grab.width=w; grab.height=h; }
  grabCtx.drawImage(video,0,sy,vw,bandH,0,0,w,h);
  const Z=window.ZXing;
  try{
    const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(grab)));
    return zx.decode(bmp).getText();
  }catch(e){ return null; }   // 못 찾으면 NotFoundException — 정상
}

async function tick(){
  if(!running) return;
  try{
    if(video.readyState>=2){
      if(detector){
        const found=await detector.detect(video);
        if(found&&found.length) onDecoded(found[0].rawValue);
      }else if(zx){
        const text=decodeZx();
        if(text) onDecoded(text);
      }
    }
  }catch(e){}
  if(running) loopTimer=setTimeout(tick,SCAN_INTERVAL_MS);
}

async function startCamera(){
  if(running||!wanted) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    overlay('이 브라우저에서는 카메라를 쓸 수 없습니다. 아래 칸에 바코드를 직접 입력해 주세요.',false); return;
  }
  overlay('카메라를 켜는 중…',false);
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  }catch(e){
    let msg='카메라를 열 수 없습니다.';
    if(e.name==='NotAllowedError') msg='카메라 권한이 필요합니다. 아래 버튼을 누르고 "허용"을 눌러 주세요.\n(계속 막혀 있으면 설정 → Safari → 카메라 → 허용)';
    else if(e.name==='NotFoundError') msg='카메라를 찾을 수 없습니다. 아래 칸에 직접 입력해 주세요.';
    else if(e.name==='NotReadableError') msg='카메라를 다른 앱이 쓰고 있습니다. 그 앱을 닫고 다시 눌러 주세요.';
    overlay(msg,e.name!=='NotFoundError'); return;
  }
  if(!wanted){ stream.getTracks().forEach(t=>t.stop()); stream=null; return; }   // 그 사이 화면을 벗어났으면
  video.srcObject=stream;
  try{ const p=video.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}

  const track=stream.getVideoTracks()[0];
  const caps=(track&&track.getCapabilities)?track.getCapabilities():{};
  if(caps.zoom){   // 앱과 같이 1.4배 (지원하는 기기만 — 아이폰 사파리는 무시된다)
    const z=Math.min(Math.max(1.4,caps.zoom.min||1),caps.zoom.max||1.4);
    track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
  }
  $('torch').hidden=!caps.torch; torchOn=false; $('torch').textContent='플래시 켜기';

  if(!detector) detector=await makeDetector();
  if(!detector&&!zx){
    if(!window.ZXing) await new Promise(r=>{ const s=document.querySelector('script[src*="zxing"]'); s.addEventListener('load',r,{once:true}); setTimeout(r,5000); });
    zx=makeZx();
  }
  if(!detector&&!zx){ overlay('바코드 인식기를 불러오지 못했습니다. 새로고침하거나 아래 칸에 직접 입력해 주세요.',true); stopCamera(); return; }
  running=true; overlay(null,false);
  tick();
}

function stopCamera(){
  running=false;
  if(loopTimer){ clearTimeout(loopTimer); loopTimer=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null;
}

$('torch').addEventListener('click',()=>{
  const track=stream&&stream.getVideoTracks()[0]; if(!track) return;
  torchOn=!torchOn;
  track.applyConstraints({advanced:[{torch:torchOn}]}).catch(()=>{ torchOn=false; });
  $('torch').textContent=torchOn?'플래시 끄기':'플래시 켜기';
});
$('camStart').addEventListener('click',()=>{ wanted=true; unlockAudio(); startCamera(); });

// 화면을 벗어나면 카메라를 놓는다(배터리·표시등). 돌아오면 다시 켠다
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ wanted=false; stopCamera(); }
  else { wanted=true; startCamera(); refreshDbInfoIfStale(); }
});
let dbCheckedAt=0;
function refreshDbInfoIfStale(){ if(Date.now()-dbCheckedAt>10*60*1000){ dbCheckedAt=Date.now(); refreshDbInfo(); } }

$('manual').addEventListener('submit',e=>{
  e.preventDefault();
  const input=$('manualInput'); const v=input.value.replace(/\s+/g,'');
  input.value=''; if(v) scanLookup(v);
});
$('manualInput').addEventListener('input',e=>{ const v=e.target.value.replace(/\s+/g,''); if(v!==e.target.value) e.target.value=v; });
$('dbinfo').addEventListener('click',()=>{ dbCheckedAt=Date.now(); refreshDbInfo(); });

// 시작
try{ showDbInfo(localStorage.getItem('db_updated_at')||'',localStorage.getItem('sheet_synced_at')||''); }catch(e){}
refreshDbInfoIfStale();
startCamera();
</script>
